name: FamilyShoppingLists
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
targets:
  FamilyShoppingLists:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - package: Supabase
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santidev.listafamiliar
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lista Familiar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  FamilyShoppingListsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: FamilyShoppingLists
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santidev.listafamiliar.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyShoppingLists:
    build:
      targets:
        FamilyShoppingLists: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyShoppingListsTests
    archive:
      config: Release
